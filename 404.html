<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – GroupChatOn</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="https://assets.groupchaton.com/assets/brand/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--gco:#5FB34C;--gco-dark:#4a9039;--gco-light:#e8f5e3;--bg:#ffffff;--text:#1a2614;--text2:#4a5a42;--border:#d9e8d4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b0e;--text:#e4f0de;--text2:#9db892;--border:#2a3d24;--gco-light:#1a2b14}}
:root[data-theme="dark"]{--bg:#111b0e;--text:#e4f0de;--text2:#9db892;--border:#2a3d24;--gco-light:#1a2b14}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.code{font-size:5rem;font-weight:700;color:var(--gco);line-height:1}
h1{font-size:1.6rem;font-weight:700;margin:16px 0 10px}
p{color:var(--text2);max-width:420px;margin-bottom:28px}
a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gco);color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;transition:background .15s}
a.btn:hover{background:var(--gco-dark)}
</style>
</head>
<body>
<div class="code">404</div>
<h1>Page not found</h1>
<p>This page doesn't exist or may have moved. Head back to the GroupChatOn home and explore our services.</p>
<a href="/" class="btn">Go to GroupChatOn home</a>
<script>(function(){var s=localStorage.getItem('gco-theme');if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
</body>
</html>
